name: Build Fanzhou APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode release keystore
        env:
          FANZHOU_KEYSTORE_BASE64: ${{ secrets.FANZHOU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FANZHOU_KEYSTORE_BASE64" ]; then
            echo "::error::Missing FANZHOU_KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$FANZHOU_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Using $SDKM (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        env:
          FANZHOU_KEYSTORE_PASSWORD: ${{ secrets.FANZHOU_KEYSTORE_PASSWORD }}
          FANZHOU_KEY_ALIAS: ${{ secrets.FANZHOU_KEY_ALIAS }}
          FANZHOU_KEY_PASSWORD: ${{ secrets.FANZHOU_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease -Pkotlin.compiler.execution.strategy=in-process
      - name: Prepare APK asset
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Fanzhou-${version}.apk"
          echo "APK_ASSET=Fanzhou-${version}.apk" >> "$GITHUB_ENV"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fanzhou-apk
          path: ${{ env.APK_ASSET }}
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_ASSET }}
          generate_release_notes: true
